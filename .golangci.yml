version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - dupword
    - errorlint
    - gosec
    - misspell
    - modernize
    - nolintlint
    - revive
    - unconvert
    - usetesting
  settings:
    errcheck:
      # Closing a connection or a file is the last thing done with it. The caller
      # has nothing left to report the error to, and the write path already
      # reports flush failures.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    gosec:
      # Frame lengths are range-checked against messageLengthMax before use, and
      # the uint32 conversions are bounded by the status enum and the frame cap.
      excludes:
        - G115
    revive:
      rules:
        - name: exported
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
    staticcheck:
      checks:
        - all
        - -QF1008
        - -ST1000
        - -ST1020
        - -ST1021
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
