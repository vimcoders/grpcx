services:
  otel-collector:
    image: otel/opentelemetry-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 # pprof 扩展
      - 8888:8888 # Collector 暴露的 Prometheus 指标
      - 8889:8889 # Prometheus exporter 指标
      - 13133:13133 # health_check 扩展
      - 4317:4317 # OTLP gRPC 接收器
      - 4318:4318 # OTLP HTTP 接收器
      - 55679:55679 # zpages 扩展
  grpc:
    build:
      dockerfile: cmd/grpc/Dockerfile
    cpus: "1.0"
    environment:
      PORT: ":50052"
    ports:
      - 50052:50052
  grpcx:
    build:
      dockerfile: cmd/grpcx/Dockerfile
    cpus: "1.0"
    environment:
      PORT: ":50051"
    ports:
      - 50051:50051