services:
  otel-collector:
    image: otel/opentelemetry-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 # pprof 扩展
      - 8888:8888 # Collector 暴露的 Prometheus 指标
      - 8889:8889 # Prometheus exporter 指标
      - 13133:13133 # health_check 扩展
      - 4317:4317 # OTLP gRPC 接收器
      - 4318:4318 # OTLP HTTP 接收器
      - 55679:55679 # zpages 扩展
  grpc:
    build:
      dockerfile: cmd/grpc/Dockerfile
    container_name: grpc
    cpus: "1"
    environment:
      PORT: ":50052"
    ports:
      - 50052:50052
    healthcheck:
      test: ["CMD", "/bin/portcheck", "--port", "50052"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  grpcx:
    build:
      dockerfile: cmd/grpcx/Dockerfile
    container_name: grpcx
    cpus: "1"
    environment:
      PORT: ":50051"
    ports:
      - 50051:50051
    healthcheck:
      test: ["CMD", "/bin/portcheck", "--port", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  bench-1k:
    image: golang:1.27.3
    cpus: "1"
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - grpc
      - grpcx
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        go version
        go env -w GOPROXY=https://goproxy.cn,https://mirrors.aliyun.com/goproxy,direct && go env -w GOSUMDB=sum.golang.google.cn
        go mod download -x
        go test -bench "^Benchmark1K$" -benchtime=10s -benchmem -count=1 ./bench/grpc
        go test -bench "^Benchmark1K$" -benchtime=10s -benchmem -count=1 ./bench/grpcx
        go test -bench "^BenchmarkParallel1K$" -cpu="1,2,4,8,16,32,64,128,250" -benchtime=10s -benchmem -count=1 ./bench/grpc
        go test -bench "^BenchmarkParallel1K$" -cpu="1,2,4,8,16,32,64,128,250" -benchtime=10s -benchmem -count=1 ./bench/grpcx
  bench-5k:
    image: golang:1.27.3
    cpus: "1"
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - grpc
      - grpcx
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        go version
        go env -w GOPROXY=https://goproxy.cn,https://mirrors.aliyun.com/goproxy,direct && go env -w GOSUMDB=sum.golang.google.cn
        go mod download -x
        go test -bench "^Benchmark5K$" -cpu="1,2,4,8" -benchtime=10s -benchmem -count=1 ./bench/grpc
        go test -bench "^Benchmark5K$" -cpu="1,2,4,8" -benchtime=10s -benchmem -count=1 ./bench/grpcx
        go test -bench "^BenchmarkParallel5K$" -cpu="1,2,4,8,16,32,64,128,250" -benchtime=10s -benchmem -count=1 ./bench/grpc
        go test -bench "^BenchmarkParallel5K$" -cpu="1,2,4,8,16,32,64,128,250" -benchtime=10s -benchmem -count=1 ./bench/grpcx
