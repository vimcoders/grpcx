syntax = "proto3";
package api;

option go_package = "./;api";

message Header {
  string Service = 1;
  string Method = 2;
  int64 Timeout = 3;
  repeated string Metadatas = 4;
  uint32 Code = 5;
  string Message = 6;
}

message Request {
  Header Header = 1;
  bytes Payload = 2;
}

message Response {
  Header Header = 1;
  bytes Payload = 2;
}
