syntax = "proto3";
package api;
option go_package = "./;api";

message Metas {
    string Path = 1;
    string Authority = 2;
    string Origin = 3;
    string Encoding = 4;
}

message Request {
    Metas Metas = 1;
    bytes Payload = 2;
}

message Response {
    uint32 Code = 2;
    string Message = 1;
    bytes Payload = 3;
}