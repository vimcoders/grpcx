syntax = "proto3";
package api;
option go_package = "./;api";

message Metas {
    string Path = 1;
    string Authority = 2;
    string Origin = 3;
    string Encoding = 4;
    string Code = 5;
}

message Request {
    Metas metas = 1;
    bytes payload = 2;
}

message Response {
    Metas metas = 1;
    bytes payload = 2;
}